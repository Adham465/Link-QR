<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ac:#6c5ce7;--tx:#14172b;--mut:#64748b;--chip:#ece9ff;--chipx:#4a3fd0;--ez:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{color:#fff;font-family:'Outfit','Segoe UI',Arial,sans-serif;overflow-x:hidden;padding-top:env(safe-area-inset-top,0px);background:radial-gradient(700px 500px at 10% 0%,#2a2170 0%,transparent 60%),radial-gradient(700px 600px at 100% 100%,#07566b 0%,transparent 60%),#0a0c18;background-attachment:fixed}
.g{background:linear-gradient(90deg,#8b7bff,#27d3ff);-webkit-background-clip:text;background-clip:text;color:transparent}
#top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:12px 20px;max-width:480px;margin:0 auto;opacity:0;transition:opacity .6s}
body.on #top{opacity:1}#top svg{width:34px;height:34px}#top b{font-size:22px}
#tr{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.14);margin-left:8px;overflow:hidden}#pb{display:block;height:100%;width:0;background:linear-gradient(90deg,#8b7bff,#27d3ff);transition:width .7s var(--ez)}

h1{font-size:32px;margin:14px 0 4px;font-weight:800}h2{font-size:24px;margin:0 0 4px}p{color:#aab2d5;font-size:17px;line-height:1.45;margin:6px 0}
.card p,.card .mut{color:var(--mut)}
.inr{animation:ir .55s var(--ez)}.inl{animation:il .55s var(--ez)}.fd{animation:up .6s var(--ez)}
@keyframes ir{from{transform:translateX(100%);opacity:0}}@keyframes il{from{transform:translateX(-100%);opacity:0}}
@keyframes up{from{opacity:0;transform:translateY(60px) scale(.96)}}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.up{animation:up .7s var(--ez) both;animation-delay:calc(var(--i,0)*.14s)}
.btn{display:block;width:100%;border:0;border-radius:18px;padding:17px;margin-top:14px;font:800 18px 'Outfit',sans-serif;color:#fff;background:linear-gradient(90deg,#6c5ce7,#27c5f0);cursor:pointer;box-shadow:0 10px 28px rgba(60,120,240,.35);transition:transform .2s,opacity .3s}.btn:active{transform:scale(.97)}
.btn.ghost{background:rgba(255,255,255,.1);box-shadow:none}.btn.alt{background:#f1f2f9;color:var(--tx);box-shadow:none;padding:13px;font-size:16px;margin-top:10px}.btn.sel{background:var(--ac);color:#fff}.btn[disabled]{opacity:.4}
.bk{width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:26px;cursor:pointer}.stp{color:#8f98c2;font-size:14px;margin-left:10px}
.big-in{width:100%;padding:18px;margin-top:18px;font:700 26px 'Outfit',sans-serif;border-radius:18px;border:2px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;outline:0;transition:border-color .3s}.big-in:focus{border-color:#8b7bff}
input[type=range]{width:100%;margin-top:26px;accent-color:#8b7bff}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}
.tile{padding:20px 10px;border-radius:24px;text-align:center;font-weight:700;font-size:17px;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.12);cursor:pointer;transition:all .3s var(--ez)}.tile span{display:block;font-size:40px;margin-bottom:6px}
.tile.on{background:linear-gradient(135deg,#6c5ce7,#27c5f0);border-color:transparent;transform:scale(1.04)}
.chip{display:inline-block;padding:10px 16px;margin:8px 8px 0 0;border-radius:22px;background:rgba(255,255,255,.1);color:#fff;font-weight:600;font-size:15px;cursor:pointer;user-select:none;transition:all .25s}
.chip.on{background:linear-gradient(90deg,#6c5ce7,#27c5f0)}.card .chip{background:var(--chip);color:var(--chipx)}.card .chip.on{background:var(--ac);color:#fff}
.card{background:#fff;color:var(--tx);border-radius:28px;padding:20px;margin-top:16px;box-shadow:0 18px 40px rgba(0,0,0,.4)}
.mc{animation:up .7s var(--ez) both;animation-delay:calc(var(--i)*.13s + .1s);transition:box-shadow .3s}.mc.sel{box-shadow:0 0 0 3px #8b7bff,0 18px 40px rgba(0,0,0,.4)}
.av{width:56px;height:56px;border-radius:18px;background:linear-gradient(135deg,#6c5ce7,#27c5f0);color:#fff;font-size:26px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.dn{width:62px;height:62px;border-radius:50%;background:conic-gradient(#6c5ce7 calc(var(--p)*1%),#e5e7ef 0);display:flex;align-items:center;justify-content:center;flex:none}.dn b{width:48px;height:48px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:16px}
.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid #eceef6;font-size:16px}.row span{color:var(--mut)}
.stt{font-size:16px;margin-top:8px}.err{color:#ff7a7f;font-size:15px;min-height:22px;margin-top:10px}
.shape{width:44%;max-width:200px;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:20px;cursor:pointer;box-shadow:0 20px 44px rgba(0,0,0,.45)}.ic{font-size:54px}
.grow{position:fixed;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:20px;overflow:hidden;transition:all .7s var(--ez)}.grow .ic{font-size:54px}
.spl{width:150px;height:150px;animation:pop 1s cubic-bezier(.3,1.6,.5,1) both}
.pulse{position:relative;width:130px;height:130px;margin:40px auto 46px}.pulse svg{width:130px;height:130px;position:relative;z-index:2}
.pulse:before,.pulse:after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid #8b7bff;animation:rg 2.2s infinite}.pulse:after{animation-delay:1.1s}
@keyframes rg{from{transform:scale(1);opacity:.8}to{transform:scale(2.6);opacity:0}}
.scan{display:inline-block;margin-top:10px;padding:10px 20px;border-radius:30px;background:rgba(255,255,255,.1);font-size:17px}.scan b{color:#27d3ff}
.lk{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,#8b7bff,#27d3ff);color:#fff;font-size:38px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 0 70px 16px rgba(60,200,255,.55);animation:pop .9s both}.lk.hit{animation:hit .5s}
@keyframes hit{50%{transform:scale(1.12);box-shadow:0 0 110px 30px rgba(60,200,255,.8)}}
.sat{position:absolute;left:50%;top:50%;margin:-22px 0 0 -22px;width:44px;height:44px;border-radius:50%;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;opacity:0;transition:transform 1s cubic-bezier(.3,.9,.3,1),opacity .4s;z-index:2;box-shadow:0 0 20px rgba(255,255,255,.35)}
.sw2{width:64px;height:36px;border-radius:18px;background:#d5d9e6;position:relative;cursor:pointer;flex:none;transition:background .3s}.sw2:after{content:"";position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:left .3s var(--ez)}.sw2.on{background:#34a853}.sw2.on:after{left:32px}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:30px 20px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,#0a0c18 55%)}.dock .btn{max-width:440px;margin:0 auto}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-30px);width:92%;max-width:440px;background:rgba(25,30,58,.95);color:#fff;border:1px solid rgba(255,255,255,.16);border-radius:18px;padding:13px 18px;box-shadow:0 14px 34px rgba(0,0,0,.5);z-index:60;opacity:0;transition:all .45s var(--ez);font-size:15px;text-align:center;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
.ag{display:flex;gap:14px;align-items:center;background:#fff;color:var(--tx);border-radius:24px;padding:14px;margin-top:12px;animation:up .6s var(--ez) both;animation-delay:calc(var(--i)*.1s)}
.dt{width:62px;height:62px;border-radius:18px;background:linear-gradient(135deg,#6c5ce7,#27c5f0);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;text-transform:uppercase;flex:none}.dt b{font-size:24px;line-height:1}
</style>

<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b7bff"/><stop offset="1" stop-color="#27d3ff"/></linearGradient><symbol id="lg" viewBox="0 0 100 100"><rect x="4" y="4" width="92" height="92" rx="26" fill="#14172b"/><g fill="none" stroke="url(#gg)" stroke-width="10" stroke-linecap="round"><rect x="20" y="36" width="36" height="28" rx="14"/><rect x="44" y="36" width="36" height="28" rx="14"/></g></symbol></defs></svg>
<div id="top"><svg><use href="#lg"/></svg><b class="g">Link</b><div id="tr"><i id="pb"></i></div></div>
<div id="app"></div>
<script>
const F={'Mechatronics & Embedded':{e:'🤖',s:['Embedded C','PCB Design','Arduino','PLC','MATLAB','IoT','Python','Microcontrollers'],t:['Embedded Systems Engineer','Firmware Engineer','Mechatronics Engineer','Automation Engineer'],c:['Delta Automation','Nile Robotics','AutoTech Egypt','Smart Circuits']},
'Software Development':{e:'💻',s:['JavaScript','React','Python','Node.js','SQL','Git','Flutter','Docker'],t:['Frontend Developer','Software Engineer','Full-Stack Developer','Mobile App Developer'],c:['Pixel Labs','CodeBridge','Cairo Soft','NileTech']},
'Marketing':{e:'📣',s:['SEO','Social Media','Copywriting','Google Ads','Analytics','Canva','Content Strategy'],t:['Digital Marketing Specialist','Content Creator','Social Media Manager'],c:['Brandly','Pulse Agency','AdWave']},
'Accounting & Finance':{e:'📊',s:['Excel','QuickBooks','Financial Reporting','Taxation','Auditing','SAP'],t:['Junior Accountant','Financial Analyst','Audit Associate'],c:['Delta Finance','Al Nour Group','Capital Hub']},
'Mechanical Engineering':{e:'⚙️',s:['AutoCAD','SolidWorks','HVAC','Thermodynamics','ANSYS','Maintenance'],t:['Mechanical Design Engineer','HVAC Engineer','Maintenance Engineer'],c:['MechaPro','Delta Engineering','Pyramid Industries']}};
const B={'Mechatronics & Embedded':[8000,35000],'Software Development':[8000,50000],'Marketing':[6000,30000],'Accounting & Finance':[6000,28000],'Mechanical Engineering':[7000,32000]};
const G=['Horizon Group','Nova Solutions','Apex Egypt','Elite Systems','BlueNile Co.','Orbit Tech'];
const C={Cairo:['Nasr City','New Cairo','Maadi','Heliopolis'],Giza:['Dokki','6th of October','Sheikh Zayed'],Alexandria:['Smouha','Sidi Gaber','Miami'],Mansoura:['El Mashaya','Toreil'],Assiut:['Downtown','New Assiut']};
const N=['Omar Hassan','Mariam Khaled','Youssef Adel','Nour Ibrahim','Karim Mostafa','Salma Ahmed','Mahmoud Tarek','Hana Samir','Ahmed Fathy','Laila Mansour','Ziad Fouad','Dina Hossam'];
const T=['10:00 AM','11:30 AM','1:00 PM','2:30 PM','4:00 PM'];
const A=document.getElementById('app'),$=id=>document.getElementById(id),FAST=/fast/.test(location.search);
const pick=a=>a[Math.floor(Math.random()*a.length)],rnd=(a,b)=>a+Math.random()*(b-a),shuf=a=>[...a].sort(()=>Math.random()-.5);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>Number(n).toLocaleString('en-US')+' EGP',r5=n=>Math.round(n/500)*500,vib=n=>{try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}};
let role,D,STP=[],L=[],S=[],TM=[],IV=[];
const later=(f,ms)=>{TM.push(setTimeout(f,ms))};
function clr(){TM.forEach(clearTimeout);IV.forEach(clearInterval);TM=[];IV=[]}
function toast(m){let t=$('tt');if(!t){t=document.createElement('div');t.id='tt';t.className='toast';document.body.appendChild(t)}t.innerHTML=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),3800)}
function show(h,dir,cb){const w=A.firstElementChild,go=()=>{A.innerHTML=`<div class="scr ${dir=='l'?'inl':dir=='f'?'fd':'inr'}">${h}</div>`;window.scrollTo(0,0);cb&&cb()};
 if(w&&dir!='f'){w.style.transition='transform .45s cubic-bezier(.2,.8,.2,1),opacity .45s';w.style.transform=`translateX(${dir=='l'?'100%':'-100%'})`;w.style.opacity=0;setTimeout(go,380)}else go()}

function splash(){A.innerHTML=`<div class="scr" style="min-height:75vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center"><svg class="spl"><use href="#lg"/></svg><h1 class="g up" style="font-size:58px;--i:5">Link</h1><p class="up" style="--i:7">One platform for every job.</p></div>`;setTimeout(()=>welcome('r'),2400)}
function welcome(dir){clr();S=[];document.body.classList.add('on');$('pb').style.width='0';
 show(`<div style="text-align:center;margin-top:20px"><h1 style="font-size:36px">Who are you?</h1><p>Choose to start. It takes one minute.</p></div><div style="display:flex;gap:16px;justify-content:center;margin-top:36px"><div class="shape up" style="--i:1;border-radius:50%;background:linear-gradient(135deg,#6c5ce7,#8b7bff)" data-r="emp"><span class="ic">👨‍🎓</span>Job Seeker</div><div class="shape up" style="--i:3;border-radius:34px;background:linear-gradient(135deg,#0a95b8,#27c5f0)" data-r="co"><span class="ic">🏢</span>Company</div></div>`,dir||'r',()=>A.querySelectorAll('.shape').forEach(el=>el.onclick=()=>{vib(15);grow(el,el.dataset.r)}))}
function grow(el,r){const b=el.getBoundingClientRect(),cs=getComputedStyle(el),g=document.createElement('div');g.className='grow';
 g.style.cssText=`left:${b.left}px;top:${b.top}px;width:${b.width}px;height:${b.height}px;border-radius:${cs.borderRadius};background:${cs.backgroundImage}`;g.innerHTML=el.innerHTML;document.body.appendChild(g);A.style.opacity=0;
 requestAnimationFrame(()=>requestAnimationFrame(()=>{g.style.left=g.style.top='0';g.style.width='100vw';g.style.height='100vh';g.style.borderRadius='0'}));
 setTimeout(()=>{wiz(r);A.style.opacity=1;g.style.opacity=0;setTimeout(()=>g.remove(),600)},800)}

function mk(r){const E=r=='emp',rg=()=>B[D.f]||[8000,35000];return[
 {h:E?'What’s your name?':'Company name',p:E?'Let companies know who you are.':'How should candidates see you?',body:()=>`<input id="in" class="big-in" value="${esc(D.name)}" placeholder="${E?'Your full name':'Your company'}" autocomplete="off">`,ok:()=>{D.name=$('in').value.trim();return D.name?'':'Please enter a name.'}},
 {h:'Your field',p:E?'Pick what you do.':'Pick the field you’re hiring in.',auto:1,body:()=>`<div class="tiles">${Object.keys(F).map((k,i)=>`<div class="tile up${D.f==k?' on':''}" style="--i:${i}" data-v="${k}"><span>${F[k].e}</span>${k}</div>`).join('')}</div>`,set:v=>{if(D.f!=v){D.skills=[];D.title=''}D.f=v}},
 ...(E?[]:[{h:'Job title',p:'What role are you hiring for?',body:()=>`<input id="in" class="big-in" value="${esc(D.title)}" placeholder="${F[D.f].t[0]}" autocomplete="off"><div>${F[D.f].t.map(t=>`<span class="chip" data-t="${t}">${t}</span>`).join('')}</div>`,ok:()=>{D.title=$('in').value.trim()||F[D.f].t[0];return''}}]),
 {h:E?'Your skills':'Required skills',p:'Tap everything that applies.',body:()=>`<div>${F[D.f].s.map(s=>`<span class="chip${D.skills.includes(s)?' on':''}" data-s="${s}">${s}</span>`).join('')}</div>`,ok:()=>D.skills.length?'':'Pick at least one skill.'},
 {h:'City',p:E?'Where do you want to work?':'Where is the job?',auto:1,body:()=>`<div class="tiles">${Object.keys(C).map((k,i)=>`<div class="tile up${D.city==k?' on':''}" style="--i:${i}" data-v="${k}"><span>🏙️</span>${k}</div>`).join('')}</div>`,set:v=>{D.city=v}},
 {h:E?'Expected salary':'Salary offer',p:()=>`Per month. Typical for ${D.f}: ${fmt(rg()[0])} – ${fmt(rg()[1])}`,btn:E?'Find my link':'Publish & link',body:()=>{const v=D.sal!=null&&D.sal!==''?D.sal:r5((rg()[0]+rg()[1])/2);return`<input id="sal" type="number" inputmode="numeric" class="big-in" style="text-align:center;font-size:44px" value="${v}"><p style="text-align:center">EGP / month</p><input id="rg" type="range" min="0" max="100000" step="500" value="${v}">`},ok:()=>{const v=$('sal').value;if(v==='')return'Enter an amount.';D.sal=+v;return''}}]}
function wiz(r){role=r;D={name:'',f:'',skills:[],city:'',sal:'',title:''};STP=mk(r);sv(0,'f')}
function sv(i,dir){const s=STP[i],last=i==STP.length-1;$('pb').style.width=((i+1)/STP.length*100)+'%';
 show(`<div style="display:flex;align-items:center;margin-top:6px"><button class="bk" id="bk">‹</button><span class="stp">${i+1} of ${STP.length}</span></div><h1>${s.h}</h1><p>${typeof s.p=='function'?s.p():s.p}</p>${s.body()}<div class="err" id="er"></div>${s.auto?'':`<div class="dock"><button class="btn" id="nx">${s.btn||'Continue'}</button></div>`}`,dir,()=>{
  $('bk').onclick=()=>i?sv(i-1,'l'):welcome('l');const nx=()=>{const e=s.ok?s.ok():'';if(e){$('er').textContent=e;vib(40);return}last?wait():sv(i+1,'r')};
  if($('nx'))$('nx').onclick=nx;const inp=$('in');if(inp){inp.onkeydown=e=>{if(e.key=='Enter')nx()};if(!inp.value)setTimeout(()=>inp.focus({preventScroll:true}),300)}
  A.querySelectorAll('.tile').forEach(t=>t.onclick=()=>{vib(12);s.set(t.dataset.v);A.querySelectorAll('.tile').forEach(x=>x.classList.toggle('on',x==t));later(()=>sv(i+1,'r'),420)});
  A.querySelectorAll('.chip[data-s]').forEach(c=>c.onclick=()=>{const k=c.dataset.s,x=D.skills.indexOf(k);x<0?D.skills.push(k):D.skills.splice(x,1);c.classList.toggle('on');vib(8)});
  A.querySelectorAll('.chip[data-t]').forEach(c=>c.onclick=()=>{$('in').value=c.dataset.t});
  const rg=$('rg');if(rg){rg.oninput=()=>$('sal').value=rg.value;$('sal').oninput=()=>rg.value=$('sal').value}})}

function wait(){const E=role=='emp',dur=FAST?3000:rnd(10,40)*1000,tot=Math.floor(rnd(1800,4200)),m=['Reading your '+(E?'application':'job ad')+'…','Scanning '+(E?'open jobs':'candidates')+'…','Comparing skills and salary…','Checking locations…','Almost there…'];$('pb').style.width='100%';
 show(`<div style="text-align:center;margin-top:30px"><div class="pulse"><svg><use href="#lg"/></svg></div><h1 class="g" style="font-size:38px;margin:0">Wait to link…</h1><p id="st" style="min-height:28px">${m[0]}</p><div class="scan"><b id="sc">0</b> ${E?'jobs':'profiles'} scanned</div><p style="font-size:14px;opacity:.7;margin-top:22px">Keep this page open</p></div>`,'r',()=>{
  const t0=Date.now();IV.push(setInterval(()=>{const k=Math.min(1,(Date.now()-t0)/dur),s=$('sc'),st=$('st');if(s)s.textContent=Math.round(tot*k).toLocaleString('en-US');if(st)st.textContent=m[Math.min(m.length-1,Math.floor(k*m.length))]},150));
  later(()=>{clr();if(gen())orbit()},dur)})}
function noLink(low,lo,hi){const E=role=='emp';
 show(`<div style="text-align:center;font-size:70px;margin-top:40px">🤔</div><h1 style="text-align:center">No link this time</h1><p style="text-align:center">${E?(low?'That expected salary is far below the market for this field, so no company would offer it.':'That expected salary is much higher than what companies pay in this field, so no company can match it.'):(low?'That offer is far below the market, so candidates for this job won’t apply.':'That offer is far above the market, so it looks unrealistic and nobody gets linked.')}</p><p style="text-align:center">Typical range for ${esc(D.f)}: <b style="color:#fff">${fmt(lo)} – ${fmt(hi)}</b></p><button class="btn" id="rt">Try again</button>`,'r',()=>$('rt').onclick=()=>sv(STP.length-1,'l'))}
function gen(){const E=role=='emp',f=F[D.f],[lo,hi]=B[D.f],s=D.sal;
 if(s<lo*.7||s>hi*1.2){noLink(s<lo*.7,lo,hi);return false}
 const names=E?[...shuf(f.c),...shuf(G)]:shuf(N),mid=(lo+hi)/2,cl=Math.max(0,1-Math.abs(s-mid)/((hi-lo)/2)),
 n=Math.max(3,Math.min(7,names.length,3+Math.round(cl*2+rnd(0,2)+(D.skills.length>3?1:0)))),
 ex=()=>{const o=f.s.filter(x=>!D.skills.includes(x));return pick(o.length?o:f.s)};
 L=names.slice(0,n).map(nm=>({nm,v:r5(E?s*rnd(.95,1.25):s*rnd(.78,1))})).map(c=>{const keep=shuf(D.skills).slice(0,D.skills.length>2&&Math.random()<.5?D.skills.length-1:D.skills.length),loc=pick(C[D.city])+', '+D.city,ts=f.t.filter(t=>t!=D.title),
  pct=Math.max(72,Math.min(98,Math.round(98-Math.abs(c.v-s)/s*45-rnd(0,6))));
  return{nm:c.nm,sub:pick(ts.length?ts:f.t),sk:[...new Set([...keep,ex()])],pct,rows:E?[['Location',loc],['Salary offer',fmt(c.v)],['Status','Hiring now']]:[['Location',loc],['Expected salary',fmt(c.v)],['Experience',pick(['Fresh graduate','1 year of experience','2 years of experience','3 years of experience'])]]}}).sort((a,b)=>b.pct-a.pct);return true}

function place(e,r,a){e.style.transform=`translate(${Math.cos(a)*r}px,${Math.sin(a)*r}px)`}
function orbit(){const n=L.length,E=role=='emp',cols=['#6c5ce7','#27c5f0','#34a853','#fbbc05','#ea4335','#8b7bff','#0a95b8'];
 show(`<div id="orb" style="position:relative;height:420px;margin-top:10px"></div><h1 class="g" style="text-align:center;margin:0;font-size:44px"><span id="n">0</span> link${n>1?'s':''}</h1><p style="text-align:center">${E?'Companies that want you':'People who applied'}</p><div class="dock"><button class="btn" id="vw" style="opacity:0;pointer-events:none">View matches</button></div>`,'r',()=>{
  const orb=$('orb');orb.innerHTML='<div class="lk" id="big" style="position:absolute;left:50%;top:50%;margin:-75px 0 0 -75px">LINK!</div>';
  const far=Math.min(orb.clientWidth/2-24,190)+80,els=L.map((it,i)=>{const e=document.createElement('div'),a=Math.PI*2*i/n+rnd(-.2,.2);e.className='sat';e.textContent=it.nm[0];e.style.background=cols[i%cols.length];e.dataset.a=a;place(e,far,a);orb.appendChild(e);return e});
  els.forEach((e,i)=>later(()=>{e.style.opacity=1;place(e,92,+e.dataset.a);later(()=>{const x=$('n'),k=$('big');if(x)x.textContent=i+1;if(k){k.classList.remove('hit');void k.offsetWidth;k.classList.add('hit')}vib(20)},900)},900+i*450));
  later(()=>{const v=$('vw');if(v){v.style.opacity=1;v.style.pointerEvents='auto';v.onclick=list}},900+n*450+1300)})}

function slot(){const u=new Set(S.map(s=>s.k));for(let i=0;i<500;i++){const d=1+Math.floor(Math.random()*14),dt=new Date();dt.setHours(0,0,0,0);dt.setDate(dt.getDate()+d);if(dt.getDay()==5||u.has(d))continue;const t=Math.floor(Math.random()*T.length);return{k:d,t:T[t],ts:dt.getTime()+t*6e4,day:dt.getDate(),mon:dt.toLocaleDateString('en-US',{month:'short'}),wd:dt.toLocaleDateString('en-US',{weekday:'long'})}}}
function fillTb(){const E=role=='emp',rows=[...S].sort((a,b)=>a.ts-b.ts);$('tb').innerHTML=rows.map((x,k)=>`<div class="ag" style="--i:${k}"><div class="dt"><b>${x.day}</b>${x.mon}</div><div style="flex:1"><b style="font-size:19px">${esc(x.who)}</b><br><span class="mut" style="color:var(--mut)">${x.wd} · ${x.t}</span></div><div style="font-size:26px">${E?'🏢':'👤'}</div></div>`).join('')}
function book(i,msg){if(S.some(x=>x.i==i))return;const t=slot();if(!t)return;S.push({...t,i,who:L[i].nm});const e=document.querySelector(`[data-t="${i}"]`);if(e)e.innerHTML=`${msg||''}<div class="fd" style="margin-top:6px">📅 <b>${t.wd}, ${t.mon} ${t.day} · ${t.t}</b><br><span class="mut">Added to Smart Schedule</span></div>`;const ss=$('ss');if(ss)ss.style.display='block';if($('tb'))fillTb()}
function showSched(){show(`<h1>📅 Smart Schedule</h1><p>Your interviews, in order</p><div id="tb"></div><button class="btn ghost" id="rs2" style="margin-top:22px">Start over</button>`,'r',()=>{fillTb();$('rs2').onclick=()=>welcome('l')})}

function list(){clr();const E=role=='emp',SE=new Set(),nm0=i=>L[i].nm.split(' ')[0];
 const head=E?'':`<div class="card up" style="display:flex;align-items:center;gap:16px;margin-top:14px;--i:0"><div class="sw2" id="au"></div><div><b>⚡ Auto-accept interview requests</b><br><span class="mut" style="font-size:15px">Or pick specific people below.</span></div></div>`;
 show(`<p style="margin:0"><a href="#" id="rs" style="color:#8b7bff;text-decoration:none">‹ Start over</a></p><h1>${E?L.length+' compan'+(L.length>1?'ies want':'y wants')+' you':L.length+' '+(L.length>1?'people':'person')+' applied'}</h1><p>${E?'Select the companies you want, then request an interview.':'for '+esc(D.title)+' at '+esc(D.name)}</p>${head}`+L.map((c,i)=>`<div class="card mc" style="--i:${i}"><div style="display:flex;gap:14px;align-items:center"><div class="av">${esc(c.nm[0])}</div><div style="flex:1"><b style="font-size:20px">${esc(c.nm)}</b><br><span class="mut">${esc(c.sub)}</span></div><div class="dn" style="--p:${c.pct}"><b>${c.pct}%</b></div></div>
<div style="margin:12px 0 4px">${c.sk.map(x=>`<span class="chip${D.skills.includes(x)?' on':''}">${x}</span>`).join('')}</div>${c.rows.map(r=>`<div class="row"><span>${r[0]}</span><b>${esc(r[1])}</b></div>`).join('')}
<div class="stt" data-t="${i}"></div><button class="btn alt" data-s="${i}">${E?'Select':'Interview'}</button></div>`).join('')+`<button class="btn" id="ss" style="display:${S.length?'block':'none'};margin-top:24px">Show Schedule</button>`+(E?'<div class="dock"><button class="btn" id="rq" disabled>Request interview</button></div>':''),'r',()=>{
 const bt=i=>document.querySelector(`[data-s="${i}"]`),st=i=>document.querySelector(`[data-t="${i}"]`),card=i=>bt(i).closest('.card');
 if(E){const rq=$('rq'),upd=()=>{rq.disabled=!SE.size;rq.textContent=SE.size?`Request interview (${SE.size})`:'Request interview'};
  A.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const i=+b.dataset.s;vib(10);if(SE.has(i)){SE.delete(i);b.classList.remove('sel');b.textContent='Select';card(i).classList.remove('sel')}else{SE.add(i);b.classList.add('sel');b.textContent='✓ Selected';card(i).classList.add('sel')}upd()});
  let q=0;rq.onclick=()=>{vib(30);[...SE].forEach(i=>{q++;bt(i).style.display='none';card(i).classList.remove('sel');st(i).innerHTML=`⏳ Waiting for <b>${esc(L[i].nm)}</b> to accept…`;
    later(()=>{book(i,`✅ <b>${esc(L[i].nm)}</b> accepted your request`);toast(`✅ ${esc(L[i].nm)} accepted your interview request`);vib([40,60,40])},FAST?1500+q*600:rnd(4000,12000))});SE.clear();upd();toast('📨 Request sent. Waiting for the companies…')}}
 else{const send=(i,m)=>{bt(i).style.display='none';book(i,m)};
  A.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const i=+b.dataset.s;vib(30);send(i,`📩 Message sent to <b>${nm0(i)}</b>: “${esc(D.name)} requested an interview with you.”`);toast(`📩 Message sent to ${esc(L[i].nm)}`)});
  $('au').onclick=()=>{const on=$('au').classList.toggle('on');IV.forEach(clearInterval);IV=[];if(on){toast('⚡ Auto-accept is on');const go=()=>{const i=L.findIndex((c,k)=>!S.some(x=>x.i==k));if(i<0){IV.forEach(clearInterval);return}send(i,`⚡ <b>${nm0(i)}</b> requested an interview. Auto-accepted`);toast(`⚡ Auto-accepted ${esc(L[i].nm)}’s request`);vib([40,60,40])};IV.push(setInterval(go,FAST?900:2200));go()}}}
 $('ss').onclick=showSched;$('rs').onclick=e=>{e.preventDefault();welcome('l')}})}
splash();
</script>
</body>
</html>
