<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Link – Try the App</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🔗%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#0f172a;--mut:#64748b;--ln:#e2e8f0;--ac:#6c5ce7;--chip:#ece9ff;--chipx:#4a3fd0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0c18;--card:#151a2e;--tx:#f1f5f9;--mut:#94a3b8;--ln:#27304d;--chip:#262a55;--chipx:#b4aaff}}
:root[data-theme="dark"]{--bg:#0a0c18;--card:#151a2e;--tx:#f1f5f9;--mut:#94a3b8;--ln:#27304d;--chip:#262a55;--chipx:#b4aaff}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font-family:'Outfit','Segoe UI',Arial,sans-serif;overflow-x:hidden}
#app{max-width:480px;margin:0 auto;min-height:100%;padding:28px 20px 36px;transition:opacity .3s}
.g{background:linear-gradient(90deg,#8b7bff,#27d3ff);-webkit-background-clip:text;background-clip:text;color:transparent}
h1{font-size:34px;margin:10px 0 6px;font-weight:800}h2{font-size:24px;margin:0 0 4px}p{color:var(--mut);font-size:17px;line-height:1.45;margin:6px 0}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:16px;margin-top:14px;font:700 18px 'Outfit',sans-serif;color:#fff;background:linear-gradient(90deg,#6c5ce7,#27c5f0);cursor:pointer}
.btn.alt{background:var(--card);color:var(--tx);border:2px solid var(--ln)}.btn.sm{padding:12px;font-size:16px;margin-top:6px}
label{display:block;font-size:13px;letter-spacing:.6px;color:var(--mut);margin-top:18px;text-transform:uppercase}
input,select{width:100%;padding:14px;margin-top:6px;border:2px solid var(--ln);border-radius:14px;background:var(--card);color:var(--tx);font:inherit;font-size:17px}
.chip{display:inline-block;padding:9px 15px;margin:8px 8px 0 0;border-radius:22px;background:var(--chip);color:var(--chipx);font-weight:600;font-size:15px;cursor:pointer;user-select:none}.chip.on{background:var(--ac);color:#fff}
.card{background:var(--card);border-radius:26px;padding:22px;margin-top:18px;box-shadow:0 14px 34px rgba(0,0,0,.14)}
.shape{width:44%;max-width:200px;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:20px;cursor:pointer;box-shadow:0 14px 34px rgba(0,0,0,.25)}.ic{font-size:54px}
.grow{position:fixed;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:20px;overflow:hidden;transition:all .7s cubic-bezier(.2,.8,.2,1)}.grow .ic{font-size:54px}
.pulse{position:relative;width:130px;height:130px;margin:60px auto 50px;border-radius:50%;background:linear-gradient(135deg,#6c5ce7,#27c5f0);display:flex;align-items:center;justify-content:center;font-size:54px}
.pulse:before,.pulse:after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid #6c5ce7;animation:rg 2.2s infinite}.pulse:after{animation-delay:1.1s}
@keyframes rg{from{transform:scale(1);opacity:.8}to{transform:scale(2.4);opacity:0}}
.lk{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,#8b7bff,#27d3ff);color:#fff;font-size:38px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 0 60px 14px rgba(60,200,255,.5);animation:pop .9s}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.sat{position:absolute;left:50%;top:50%;margin:-22px 0 0 -22px;width:44px;height:44px;border-radius:50%;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;opacity:0;transition:transform 1s cubic-bezier(.3,.9,.3,1),opacity .4s;z-index:2}
.fade{animation:fd .5s}@keyframes fd{from{opacity:0;transform:translateY(14px)}}
.row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--ln);font-size:16px}.row span:first-child{color:var(--mut)}
.tr{display:grid;grid-template-columns:1.2fr .9fr 1.4fr;gap:8px;padding:11px 0;border-top:1px solid var(--ln);font-size:15px}.tr.h{border:0;color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.6px}
.err{color:#e5484d;font-size:15px;margin-top:10px;min-height:20px}
.av{width:60px;height:60px;border-radius:18px;background:linear-gradient(135deg,#6c5ce7,#27c5f0);color:#fff;font-size:28px;font-weight:800;display:flex;align-items:center;justify-content:center}
.pct{font-size:34px;font-weight:800}
.inr{animation:fr .55s ease-out}@keyframes fr{from{transform:translateX(110%);opacity:0}}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);width:92%;max-width:440px;background:var(--card);color:var(--tx);border-radius:16px;padding:12px 18px;box-shadow:0 10px 30px rgba(0,0,0,.3);z-index:60;opacity:0;transition:opacity .3s;font-size:15px;text-align:center;pointer-events:none}
.sw2{width:64px;height:36px;border-radius:18px;background:var(--ln);position:relative;cursor:pointer;flex:none;transition:background .3s}.sw2:after{content:"";position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:50%;background:#fff;transition:left .3s}.sw2.on{background:#34a853}.sw2.on:after{left:32px}
.btn[disabled]{opacity:.45;cursor:default}.btn.sel{background:var(--ac);color:#fff;border-color:var(--ac)}.stt{font-size:16px;margin-top:8px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const F={
'Mechatronics & Embedded':{s:['Embedded C','PCB Design','Arduino','PLC','MATLAB','IoT','Python','Microcontrollers'],t:['Embedded Systems Engineer','Firmware Engineer','Mechatronics Engineer','Automation Engineer'],c:['Delta Automation','Nile Robotics','AutoTech Egypt','Smart Circuits']},
'Software Development':{s:['JavaScript','React','Python','Node.js','SQL','Git','Flutter','Docker'],t:['Frontend Developer','Software Engineer','Full-Stack Developer','Mobile App Developer'],c:['Pixel Labs','CodeBridge','Cairo Soft','NileTech']},
'Marketing':{s:['SEO','Social Media','Copywriting','Google Ads','Analytics','Canva','Content Strategy'],t:['Digital Marketing Specialist','Content Creator','Social Media Manager'],c:['Brandly','Pulse Agency','AdWave']},
'Accounting & Finance':{s:['Excel','QuickBooks','Financial Reporting','Taxation','Auditing','SAP'],t:['Junior Accountant','Financial Analyst','Audit Associate'],c:['Delta Finance','Al Nour Group','Capital Hub']},
'Mechanical Engineering':{s:['AutoCAD','SolidWorks','HVAC','Thermodynamics','ANSYS','Maintenance'],t:['Mechanical Design Engineer','HVAC Engineer','Maintenance Engineer'],c:['MechaPro','Delta Engineering','Pyramid Industries']}};
const G=['Horizon Group','Nova Solutions','Apex Egypt','Elite Systems','BlueNile Co.','Orbit Tech'];
const C={Cairo:['Nasr City','New Cairo','Maadi','Heliopolis'],Giza:['Dokki','6th of October','Sheikh Zayed'],Alexandria:['Smouha','Sidi Gaber','Miami'],Mansoura:['El Mashaya','Toreil'],Assiut:['Downtown','New Assiut']};
const N=['Omar Hassan','Mariam Khaled','Youssef Adel','Nour Ibrahim','Karim Mostafa','Salma Ahmed','Mahmoud Tarek','Hana Samir','Ahmed Fathy','Laila Mansour','Ziad Fouad','Dina Hossam'];
const T=['10:00 AM','11:30 AM','1:00 PM','2:30 PM','4:00 PM'];
const A=document.getElementById('app'),$=id=>document.getElementById(id);
const pick=a=>a[Math.floor(Math.random()*a.length)],rnd=(a,b)=>a+Math.random()*(b-a),shuf=a=>[...a].sort(()=>Math.random()-.5);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const R=h=>{A.innerHTML='<div class="fade">'+h+'</div>'};
const fmt=n=>Number(n).toLocaleString('en-US')+' EGP',r5=n=>Math.round(n/500)*500;
let role,D,sel=new Set(),L=[],S=[];

function welcome(){clr();S=[];R(`<div class="big" style="text-align:center;font-size:56px;margin-top:10px">🔗</div><h1 class="g" style="text-align:center">Link</h1><p style="text-align:center">One platform for every job.<br>Choose who you are:</p>
<div style="display:flex;gap:16px;justify-content:center;margin-top:34px"><div class="shape" data-r="emp" style="border-radius:50%;background:linear-gradient(135deg,#6c5ce7,#8b7bff)"><span class="ic">👨‍🎓</span>Job Seeker</div><div class="shape" data-r="co" style="border-radius:34px;background:linear-gradient(135deg,#0a95b8,#27c5f0)"><span class="ic">🏢</span>Company</div></div>`);
 A.querySelectorAll('.shape').forEach(el=>el.onclick=()=>grow(el,el.dataset.r))}
function grow(el,r){const b=el.getBoundingClientRect(),cs=getComputedStyle(el),g=document.createElement('div');g.className='grow';
 g.style.cssText=`left:${b.left}px;top:${b.top}px;width:${b.width}px;height:${b.height}px;border-radius:${cs.borderRadius};background:${cs.backgroundImage}`;g.innerHTML=el.innerHTML;document.body.appendChild(g);A.style.opacity=0;
 requestAnimationFrame(()=>requestAnimationFrame(()=>{g.style.left=g.style.top='0';g.style.width='100vw';g.style.height='100vh';g.style.borderRadius='0'}));
 setTimeout(()=>{showForm(r);A.style.opacity=1;g.style.opacity=0;setTimeout(()=>g.remove(),500)},750)}

function chips(){const f=$('fld').value;$('chips').innerHTML=F[f].s.map(s=>`<span class="chip${sel.has(s)?' on':''}" data-s="${s}">${s}</span>`).join('')}
function showForm(r){role=r;sel=new Set();const E=r=='emp';
 R(`<p style="margin:0"><a href="#" id="bk" style="color:var(--ac);text-decoration:none">‹ Back</a></p><h2 style="margin-top:14px">${E?'Your job application':'Your job ad'}</h2><p>${E?'Tell us about you and what you want.':'Tell us who you’re looking for.'}</p>
<label>${E?'Full name':'Company name'}</label><input id="nm" autocomplete="off">
<label>Field</label><select id="fld">${Object.keys(F).map(k=>`<option>${k}</option>`).join('')}</select>
${E?'':'<label>Job title</label><input id="jt" placeholder="e.g. Embedded Systems Engineer" autocomplete="off">'}
<label>${E?'Your skills':'Required skills'}</label><div id="chips"></div>
<label>City</label><select id="city">${Object.keys(C).map(k=>`<option>${k}</option>`).join('')}</select>
<label>${E?'Expected salary (EGP / month)':'Salary offer (EGP / month)'}</label><input id="sal" type="number" inputmode="numeric" placeholder="15000">
<div class="err" id="er"></div><button class="btn" id="go">${E?'Send application':'Publish job'}</button>`);
 $('bk').onclick=e=>{e.preventDefault();welcome()};chips();$('fld').onchange=()=>{sel.clear();chips()};
 $('chips').onclick=e=>{const s=e.target.dataset.s;if(!s)return;sel.has(s)?sel.delete(s):sel.add(s);e.target.classList.toggle('on')};
 $('go').onclick=()=>{const f=$('fld').value;D={name:$('nm').value.trim(),f,skills:[...sel],city:$('city').value,sal:+$('sal').value,title:E?'':($('jt').value.trim()||F[f].t[0])};
  if(!D.name||!D.skills.length||!(D.sal>0)){$('er').textContent='Please add a name, at least one skill and a salary.';return}wait()}}

function wait(){const E=role=='emp',dur=/fast/.test(location.search)?3000:rnd(10,40)*1000;
 const m=['Reading your '+(E?'application':'job ad')+'…','Scanning '+(E?'open jobs':'candidates')+'…','Comparing skills and salary…','Checking locations…','Almost there…'];
 R(`<div class="pulse">🔗</div><h1 class="g" style="text-align:center">Wait to link…</h1><p id="st" style="text-align:center">${m[0]}</p><p style="text-align:center;font-size:14px">Keep this page open</p>`);
 let i=0;const iv=setInterval(()=>{i=Math.min(i+1,m.length-1);const s=$('st');if(s)s.textContent=m[i]},dur/m.length);
 setTimeout(()=>{clearInterval(iv);if(gen())orbit()},dur)}

const B={'Mechatronics & Embedded':[8000,35000],'Software Development':[8000,50000],'Marketing':[6000,30000],'Accounting & Finance':[6000,28000],'Mechanical Engineering':[7000,32000]};
function noLink(low,lo,hi){const E=role=='emp';
 R(`<div style="text-align:center;font-size:64px;margin-top:30px">🤔</div><h2 style="text-align:center">No link this time</h2><p style="text-align:center">${E?(low?'That expected salary is far below the market for this field, so no company would offer it.':'That expected salary is much higher than what companies pay in this field, so no company can match it.'):(low?'That offer is far below the market, so candidates for this job won’t apply.':'That offer is far above the market, so it looks unrealistic and nobody gets linked.')}</p><p style="text-align:center">Typical range for ${esc(D.f)}: <b>${fmt(lo)} – ${fmt(hi)}</b></p><button class="btn" id="rt">Try again</button>`);$('rt').onclick=()=>showForm(role)}
function gen(){const E=role=='emp',f=F[D.f],[lo,hi]=B[D.f],s=D.sal;
 if(s<lo*.7||s>hi*1.2){noLink(s<lo*.7,lo,hi);return false}
 const names=E?[...shuf(f.c),...shuf(G)]:shuf(N),pool=Math.min(names.length,4+D.skills.length*2),v=()=>r5(lo+(hi-lo)*(Math.random()+Math.random()+Math.random())/3),
 ex=()=>{const o=f.s.filter(x=>!D.skills.includes(x));return pick(o.length?o:f.s)};
 let m=names.slice(0,pool).map(nm=>({nm,v:v()})).filter(c=>E?(c.v>=s*.92&&c.v<=s*1.3):(c.v>=s*.75&&c.v<=s*1.05));
 if(!m.length)m=[{nm:names[0],v:r5(E?s*rnd(.97,1.1):s*rnd(.8,.98))}];
 L=m.slice(0,6).map(c=>{const keep=shuf(D.skills).slice(0,D.skills.length>2&&Math.random()<.5?D.skills.length-1:D.skills.length),loc=pick(C[D.city])+', '+D.city,ts=f.t.filter(t=>t!=D.title),
  pct=Math.max(72,Math.min(98,Math.round(98-Math.abs(c.v-s)/s*45-rnd(0,6))));
  return{nm:c.nm,sub:pick(ts.length?ts:f.t),sk:[...new Set([...keep,ex()])],pct,rows:E?[['Location',loc],['Salary offer',fmt(c.v)],['Status','Hiring now']]:[['Location',loc],['Expected salary',fmt(c.v)],['Experience',pick(['Fresh graduate','1 year of experience','2 years of experience','3 years of experience'])]]}}).sort((a,b)=>b.pct-a.pct);return true}

function place(e,r,a){e.style.transform=`translate(${Math.cos(a)*r}px,${Math.sin(a)*r}px)`}
function orbit(){const n=L.length,E=role=='emp',cols=['#6c5ce7','#27c5f0','#34a853','#fbbc05','#ea4335','#8b7bff','#0a95b8'];
 R(`<div id="orb" style="position:relative;height:420px;margin-top:10px"></div><h1 class="g" style="text-align:center;margin:0"><span id="n">0</span> link${n>1?'s':''}</h1><p style="text-align:center">${E?'Companies that want you':'People who applied'}</p><button class="btn" id="vw" style="display:none">View matches</button>`);
 const orb=$('orb');orb.innerHTML='<div class="lk" style="position:absolute;left:50%;top:50%;margin:-75px 0 0 -75px">LINK!</div>';
 const far=Math.min(orb.clientWidth/2-24,190)+70,els=L.map((it,i)=>{const e=document.createElement('div'),a=Math.PI*2*i/n+rnd(-.2,.2);e.className='sat';e.textContent=it.nm[0];e.style.background=cols[i%cols.length];e.dataset.a=a;place(e,far,a);orb.appendChild(e);return e});
 els.forEach((e,i)=>setTimeout(()=>{e.style.opacity=1;place(e,92,+e.dataset.a);setTimeout(()=>{const x=$('n');if(x)x.textContent=i+1},900)},900+i*450));
 setTimeout(()=>{const v=$('vw');if(v){v.style.display='block';v.onclick=list}},900+n*450+1300)}

function slot(){const u=new Set(S.map(s=>s.k));for(let i=0;i<300;i++){const d=1+Math.floor(Math.random()*7),t=Math.floor(Math.random()*T.length),k=d+'-'+t;if(!u.has(k)){const dt=new Date();dt.setHours(0,0,0,0);dt.setDate(dt.getDate()+d);return{k,t:T[t],ts:dt.getTime()+t*6e4,date:dt.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}}}}
let TM=[],AI=null;const FAST=/fast/.test(location.search),later=(f,ms)=>{TM.push(setTimeout(f,ms))};
function clr(){TM.forEach(clearTimeout);TM=[];clearInterval(AI);AI=null}
function toast(m){let t=$('tt');if(!t){t=document.createElement('div');t.id='tt';t.className='toast';document.body.appendChild(t)}t.innerHTML=m;t.style.opacity=1;clearTimeout(t._h);t._h=setTimeout(()=>t.style.opacity=0,3800)}
function fillTb(){const E=role=='emp',rows=[...S].sort((a,b)=>a.ts-b.ts);$('tb').innerHTML=`<div class="tr h"><span>Date</span><span>Time</span><span>${E?'Company':'Candidate'}</span></div>`+rows.map(x=>`<div class="tr"><b>${x.date}</b><span>${x.t}</span><b>${esc(x.who)}</b></div>`).join('')}
function book(i,msg){if(S.some(x=>x.i==i))return;const t=slot();if(!t)return;S.push({...t,i,who:L[i].nm});const e=document.querySelector(`[data-t="${i}"]`);if(e)e.innerHTML=`${msg||''}<div class="fade" style="margin-top:6px">📅 <b>${t.date} · ${t.t}</b> · added to Smart Schedule</div>`;const ss=$('ss');if(ss)ss.style.display='block';if($('tb'))fillTb()}
function showSched(){const w=A.firstElementChild;w.style.transition='transform .55s ease,opacity .55s';w.style.transform='translateX(-120%)';w.style.opacity=0;
 setTimeout(()=>{A.innerHTML=`<div class="inr"><h2>📅 Smart Schedule</h2><p>Your interviews, in order</p><div class="card" id="tb"></div><button class="btn alt" id="rs2">Start over</button></div>`;fillTb();window.scrollTo(0,0);$('rs2').onclick=welcome},550)}
function list(){clr();const E=role=='emp',SE=new Set(),RQ=new Set(),nm0=i=>L[i].nm.split(' ')[0];
 const head=E?'<button class="btn" id="rq" disabled>Request interview</button>':`<div class="card" style="display:flex;align-items:center;gap:16px;margin-top:14px"><div class="sw2" id="au"></div><div><b>⚡ Auto-accept interview requests</b><br><span style="color:var(--mut);font-size:15px">Or pick specific people below.</span></div></div>`;
 R(`<p style="margin:0"><a href="#" id="rs" style="color:var(--ac);text-decoration:none">‹ Start over</a></p><h2 style="text-align:center;margin-top:10px">${E?L.length+' compan'+(L.length>1?'ies want':'y wants')+' you':L.length+' '+(L.length>1?'people':'person')+' applied'}</h2><p style="text-align:center">${E?'Select the companies you want, then request an interview.':'for '+esc(D.title)+' at '+esc(D.name)}</p>${head}`+L.map((c,i)=>`<div class="card"><div style="display:flex;gap:14px;align-items:center"><div class="av">${esc(c.nm[0])}</div><div style="flex:1"><b style="font-size:20px">${esc(c.nm)}</b><br><span style="color:var(--mut)">${esc(c.sub)}</span></div><div class="pct g">${c.pct}%</div></div>
<div style="margin:12px 0 4px">${c.sk.map(x=>`<span class="chip${D.skills.includes(x)?' on':''}">${x}</span>`).join('')}</div>${c.rows.map(r=>`<div class="row"><span>${r[0]}</span><b>${esc(r[1])}</b></div>`).join('')}
<div class="stt" data-t="${i}"></div><button class="btn alt sm" data-s="${i}">${E?'Select':'Interview'}</button></div>`).join('')+`<button class="btn" id="ss" style="display:${S.length?'block':'none'}">Show Schedule</button>`);
 const bt=i=>document.querySelector(`[data-s="${i}"]`),st=i=>document.querySelector(`[data-t="${i}"]`);
 if(E){const rq=$('rq'),upd=()=>{rq.disabled=!SE.size;rq.textContent=SE.size?`Request interview (${SE.size})`:'Request interview'};
  A.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const i=+b.dataset.s;if(SE.has(i)){SE.delete(i);b.classList.remove('sel');b.textContent='Select'}else{SE.add(i);b.classList.add('sel');b.textContent='✓ Selected'}upd()});
  rq.onclick=()=>{[...SE].forEach(i=>{RQ.add(i);bt(i).style.display='none';st(i).innerHTML=`⏳ Waiting for <b>${esc(L[i].nm)}</b> to accept…`;
    later(()=>{book(i,`✅ <b>${esc(L[i].nm)}</b> accepted your request`);toast(`✅ ${esc(L[i].nm)} accepted your interview request`)},FAST?1500+RQ.size*500:rnd(4000,12000))});SE.clear();upd();toast('📨 Request sent. Waiting for the companies…')}}
 else{const send=(i,m)=>{bt(i).style.display='none';book(i,m)};
  A.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const i=+b.dataset.s;send(i,`📩 Message sent to <b>${nm0(i)}</b>: “${esc(D.name)} requested an interview with you.”`);toast(`📩 Message sent to ${esc(L[i].nm)}`)});
  $('au').onclick=()=>{const on=$('au').classList.toggle('on');clearInterval(AI);AI=null;if(on){toast('⚡ Auto-accept is on');const go=()=>{const i=L.findIndex((c,k)=>!S.some(x=>x.i==k));if(i<0){clearInterval(AI);return}send(i,`⚡ <b>${nm0(i)}</b> requested an interview. Auto-accepted`);toast(`⚡ Auto-accepted ${esc(L[i].nm)}’s request`)};AI=setInterval(go,FAST?900:2200);go()}}}
 $('ss').onclick=showSched;$('rs').onclick=e=>{e.preventDefault();welcome()}}
welcome();
</script>
</body>
</html>
