<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Link – Try the App</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🔗%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#0f172a;--mut:#64748b;--ln:#e2e8f0;--ac:#6c5ce7;--chip:#ece9ff;--chipx:#4a3fd0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0c18;--card:#151a2e;--tx:#f1f5f9;--mut:#94a3b8;--ln:#27304d;--chip:#262a55;--chipx:#b4aaff}}
:root[data-theme="dark"]{--bg:#0a0c18;--card:#151a2e;--tx:#f1f5f9;--mut:#94a3b8;--ln:#27304d;--chip:#262a55;--chipx:#b4aaff}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font-family:'Outfit','Segoe UI',Arial,sans-serif}
#app{max-width:480px;margin:0 auto;min-height:100%;padding:28px 20px 36px}
.g{background:linear-gradient(90deg,#8b7bff,#27d3ff);-webkit-background-clip:text;background-clip:text;color:transparent}
h1{font-size:34px;margin:10px 0 6px;font-weight:800}h2{font-size:24px;margin:0 0 4px}p{color:var(--mut);font-size:17px;line-height:1.45;margin:6px 0}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:16px;margin-top:14px;font:700 18px 'Outfit',sans-serif;color:#fff;background:linear-gradient(90deg,#6c5ce7,#27c5f0);cursor:pointer}
.btn.alt{background:var(--card);color:var(--tx);border:2px solid var(--ln)}
label{display:block;font-size:13px;letter-spacing:.6px;color:var(--mut);margin-top:18px;text-transform:uppercase}
input,select{width:100%;padding:14px;margin-top:6px;border:2px solid var(--ln);border-radius:14px;background:var(--card);color:var(--tx);font:inherit;font-size:17px}
.chip{display:inline-block;padding:9px 15px;margin:8px 8px 0 0;border-radius:22px;background:var(--chip);color:var(--chipx);font-weight:600;font-size:15px;cursor:pointer;user-select:none}
.chip.on{background:var(--ac);color:#fff}
.card{background:var(--card);border-radius:26px;padding:22px;margin-top:18px;box-shadow:0 14px 34px rgba(0,0,0,.14)}
.big{font-size:60px;text-align:center;margin-top:10px}
.pulse{position:relative;width:130px;height:130px;margin:60px auto 50px;border-radius:50%;background:linear-gradient(135deg,#6c5ce7,#27c5f0);display:flex;align-items:center;justify-content:center;font-size:54px}
.pulse:before,.pulse:after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid #6c5ce7;animation:rg 2.2s infinite}.pulse:after{animation-delay:1.1s}
@keyframes rg{from{transform:scale(1);opacity:.8}to{transform:scale(2.4);opacity:0}}
.lk{width:150px;height:150px;margin:14px auto;border-radius:50%;background:radial-gradient(circle,#8b7bff,#27d3ff);color:#fff;font-size:38px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 0 60px 14px rgba(60,200,255,.5);animation:pop .9s}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.fade{animation:fd .5s}@keyframes fd{from{opacity:0;transform:translateY(14px)}}
.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--ln);font-size:17px}.row span:first-child{color:var(--mut)}
.err{color:#e5484d;font-size:15px;margin-top:10px;min-height:20px}
.av{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,#6c5ce7,#27c5f0);color:#fff;font-size:30px;font-weight:800;display:flex;align-items:center;justify-content:center}
.pct{font-size:44px;font-weight:800;text-align:right}
</style>
</head>
<body>
<div id="app"></div>
<script>
const F={
'Mechatronics & Embedded':{s:['Embedded C','PCB Design','Arduino','PLC','MATLAB','IoT','Python','Microcontrollers'],t:['Embedded Systems Engineer','Firmware Engineer','Mechatronics Engineer','Automation Engineer'],c:['Delta Automation','Nile Robotics','AutoTech Egypt','Smart Circuits']},
'Software Development':{s:['JavaScript','React','Python','Node.js','SQL','Git','Flutter','Docker'],t:['Frontend Developer','Software Engineer','Full-Stack Developer','Mobile App Developer'],c:['Pixel Labs','CodeBridge','Cairo Soft','NileTech']},
'Marketing':{s:['SEO','Social Media','Copywriting','Google Ads','Analytics','Canva','Content Strategy'],t:['Digital Marketing Specialist','Content Creator','Social Media Manager'],c:['Brandly','Pulse Agency','AdWave']},
'Accounting & Finance':{s:['Excel','QuickBooks','Financial Reporting','Taxation','Auditing','SAP'],t:['Junior Accountant','Financial Analyst','Audit Associate'],c:['Delta Finance','Al Nour Group','Capital Hub']},
'Mechanical Engineering':{s:['AutoCAD','SolidWorks','HVAC','Thermodynamics','ANSYS','Maintenance'],t:['Mechanical Design Engineer','HVAC Engineer','Maintenance Engineer'],c:['MechaPro','Delta Engineering','Pyramid Industries']}};
const C={Cairo:['Nasr City','New Cairo','Maadi','Heliopolis'],Giza:['Dokki','6th of October','Sheikh Zayed'],Alexandria:['Smouha','Sidi Gaber','Miami'],Mansoura:['El Mashaya','Toreil'],Assiut:['Downtown','New Assiut']};
const N=['Omar Hassan','Mariam Khaled','Youssef Adel','Nour Ibrahim','Karim Mostafa','Salma Ahmed','Mahmoud Tarek','Hana Samir'];
const A=document.getElementById('app'),$=id=>document.getElementById(id);
const pick=a=>a[Math.floor(Math.random()*a.length)],rnd=(a,b)=>a+Math.random()*(b-a),shuf=a=>[...a].sort(()=>Math.random()-.5);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const R=(h)=>{A.innerHTML='<div class="fade">'+h+'</div>'};
const fmt=n=>Number(n).toLocaleString('en-US')+' EGP';
let role,D,sel=new Set(),timer;

function welcome(){R(`<div class="big">🔗</div><h1 class="g" style="text-align:center">Link</h1><p style="text-align:center">One platform for every job.<br>Try the app in one minute.</p>
<button class="btn" data-r="emp">I’m a Job Seeker</button><button class="btn alt" data-r="co">I’m a Company</button>`);A.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>showForm(b.dataset.r))}

function chips(){const f=$('fld').value;$('chips').innerHTML=F[f].s.map(s=>`<span class="chip${sel.has(s)?' on':''}" data-s="${s}">${s}</span>`).join('')}
function showForm(r){role=r;sel=new Set();const E=r=='emp';
 R(`<p style="margin:0"><a href="#" onclick="welcome();return false" style="color:var(--ac);text-decoration:none">‹ Back</a></p><h2 style="margin-top:14px">${E?'Create your profile':'Post a new job'}</h2><p>${E?'Tell us about you and what you want.':'Tell us who you’re looking for.'}</p>
<label>${E?'Full name':'Company name'}</label><input id="nm" autocomplete="off">
<label>Field</label><select id="fld">${Object.keys(F).map(k=>`<option>${k}</option>`).join('')}</select>
${E?'':'<label>Job title</label><input id="jt" placeholder="e.g. Embedded Systems Engineer" autocomplete="off">'}
<label>${E?'Your skills':'Required skills'}</label><div id="chips"></div>
<label>City</label><select id="city">${Object.keys(C).map(k=>`<option>${k}</option>`).join('')}</select>
<label>${E?'Expected salary (EGP / month)':'Salary offer (EGP / month)'}</label><input id="sal" type="number" inputmode="numeric" placeholder="15000">
<div class="err" id="er"></div><button class="btn" id="go">${E?'Create profile':'Publish job'}</button>`);
 chips();$('fld').onchange=()=>{sel.clear();chips()};
 $('chips').onclick=e=>{const s=e.target.dataset.s;if(!s)return;sel.has(s)?sel.delete(s):sel.add(s);e.target.classList.toggle('on')};
 $('go').onclick=()=>{const f=$('fld').value;D={name:$('nm').value.trim(),f,skills:[...sel],city:$('city').value,sal:+$('sal').value,title:E?'':($('jt').value.trim()||F[f].t[0])};
  if(!D.name||!D.skills.length||!(D.sal>0)){$('er').textContent='Please add a name, at least one skill and a salary.';return}wait()}}

function wait(){const dur=/fast/.test(location.search)?3000:rnd(10,40)*1000,E=role=='emp';
 const m=['Reading your '+(E?'profile':'job post')+'…','Scanning '+(E?'open jobs':'candidates')+'…','Comparing skills and salary…','Checking locations…','Almost there…'];
 R(`<div class="pulse">🔗</div><h1 class="g" style="text-align:center">Wait to link…</h1><p id="st" style="text-align:center">${m[0]}</p><p style="text-align:center;font-size:14px">Keep this page open</p>`);
 let i=0;const iv=setInterval(()=>{i=Math.min(i+1,m.length-1);const s=$('st');if(s)s.textContent=m[i]},dur/m.length);
 timer=setTimeout(()=>{clearInterval(iv);result()},dur)}

function result(){if(role!='emp')return multi();const E=role=='emp',f=F[D.f],extra=pick(f.s.filter(s=>!D.skills.includes(s))||f.s)||pick(f.s),
 keep=shuf(D.skills).slice(0,D.skills.length>2?D.skills.length-1:D.skills.length),sk=[...keep,extra],
 dist=pick(C[D.city]),pct=Math.floor(rnd(88,98)),r5=n=>Math.round(n/500)*500;
 let name,title,sal,sub,rows;
 if(E){name=pick(f.c);title=pick(f.t);sal=r5(D.sal*rnd(.96,1.14));sub='Hiring now';rows=[['Job title',title],['Location',dist+', '+D.city],['Salary offer',fmt(sal)]]}
 else{name=pick(N);const ts=f.t.filter(t=>t!=D.title);title=pick(ts.length?ts:f.t);sal=r5(D.sal*rnd(.85,.98));sub=pick(['Fresh graduate','1 year of experience','2 years of experience']);rows=[['Looking for',title],['Location',dist+', '+D.city],['Expected salary',fmt(sal)],['Experience',sub]]}
 R(`<div class="lk">LINK!</div><h2 style="text-align:center">${E?'You’re linked with '+esc(name):'You’ve got a match!'}</h2>
<div class="card"><div style="display:flex;gap:14px;align-items:center"><div class="av">${esc(name[0])}</div><div style="flex:1"><b style="font-size:21px">${esc(name)}</b><br><span style="color:var(--mut)">${E?sub:esc(D.f)}</span></div><div class="pct g">${pct}%</div></div>
<div style="margin:14px 0 6px">${sk.map(s=>`<span class="chip${D.skills.includes(s)?' on':''}">${s}</span>`).join('')}</div>
${rows.map(r=>`<div class="row"><span>${r[0]}</span><b>${esc(r[1])}</b></div>`).join('')}</div>
<div id="sch"></div><button class="btn" id="sb">Schedule an interview</button><button class="btn alt" onclick="welcome()">Start over</button>`);
 $('sb').onclick=()=>{$('sch').innerHTML=`<div class="card fade"><b>📅 Smart Schedule</b><p style="color:var(--tx);font-size:19px">Interview set for <b>${pick(['Sunday','Monday','Tuesday','Wednesday','Thursday'])}, ${pick(['10:00 AM','11:30 AM','1:00 PM','2:30 PM'])}</b></p><p>Both sides were notified.</p></div>`;$('sb').style.display='none'}}
function multi(){const f=F[D.f],r5=x=>Math.round(x/500)*500,names=shuf(N).slice(0,Math.floor(rnd(4,8)));
 const L=names.map(nm=>{const ex=shuf(f.s.filter(s=>!D.skills.includes(s))).slice(0,1),keep=shuf(D.skills).slice(0,Math.max(1,D.skills.length-(Math.random()<.4?1:0)));
  return{nm,sk:[...keep,...ex],pct:Math.floor(rnd(72,98)),t:pick(f.t),sal:r5(D.sal*rnd(.82,1.02)),d:pick(C[D.city]),xp:pick(['Fresh graduate','1 year of experience','2 years of experience','3 years of experience'])}}).sort((a,b)=>b.pct-a.pct);
 const card=(c,i)=>`<div class="card"><div style="display:flex;gap:14px;align-items:center"><div class="av">${c.nm[0]}</div><div style="flex:1"><b style="font-size:20px">${c.nm}</b><br><span style="color:var(--mut)">${c.t}</span></div><div class="pct g" style="font-size:34px">${c.pct}%</div></div><div style="margin:12px 0 4px">${c.sk.map(s=>`<span class="chip${D.skills.includes(s)?' on':''}">${s}</span>`).join('')}</div><div class="row"><span>Location</span><b>${c.d}, ${esc(D.city)}</b></div><div class="row"><span>Expected salary</span><b>${fmt(c.sal)}</b></div><div class="row"><span>Experience</span><b>${c.xp}</b></div><button class="btn alt iv" style="margin-top:6px;padding:12px;font-size:16px">Schedule interview</button></div>`;
 R(`<div class="lk">LINK!</div><h2 style="text-align:center">${L.length} people applied</h2><p style="text-align:center">for ${esc(D.title)} at ${esc(D.name)}</p>`+L.map(card).join('')+`<button class="btn alt" onclick="welcome()">Start over</button>`);
 A.querySelectorAll('.iv').forEach(b=>b.onclick=()=>{b.outerHTML='<p class="fade" style="color:var(--tx)">📅 <b>'+pick(['Sunday','Monday','Tuesday','Wednesday','Thursday'])+', '+pick(['10:00 AM','11:30 AM','1:00 PM','2:30 PM'])+'</b> · interview scheduled</p>'})}
welcome();
</script>
</body>
</html>
